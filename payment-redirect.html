<!DOCTYPE html>
<html>
<head>
  <script src="clean-url.js"></script>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';">
<title>Redirecting...</title>
<script>
(function(){
  var s = window.location.search.toLowerCase();
  var oid = '';
  var m = window.location.search.match(/[?&](?:order_id|id|invoice_id)=([^&]+)/i);
  if (m) oid = decodeURIComponent(m[1]);

  var failed = s.indexOf('failed') !== -1 || s.indexOf('failure') !== -1 || s.indexOf('error') !== -1 || s.indexOf('declin') !== -1 || s.indexOf('refus') !== -1;
  var expired = s.indexOf('expired') !== -1 || s.indexOf('timeout') !== -1 || s.indexOf('session time') !== -1;
  var cancelled = s.indexOf('cancelled') !== -1 || s.indexOf('canceled') !== -1 || s.indexOf('cancel') !== -1 || s.indexOf('annul') !== -1 || s.indexOf('ignore') !== -1 || s.indexOf('result=cancelled') !== -1;
  var result = failed ? 'failed' : expired ? 'expired' : cancelled ? 'cancelled' : 'check';
  // Never declare a payment successful from browser parameters. The thank-you
  // page asks verify-payment to obtain the authoritative SlickPay state.
  window.location.replace('thank-you?order_id=' + oid + '&gateway_result=' + encodeURIComponent(result));
})();
</script>
</head>
<body></body>
</html>
